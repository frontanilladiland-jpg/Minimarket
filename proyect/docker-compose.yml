version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_minimarket
    environment:
      POSTGRES_DB: db_minimarket_pro413
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 120906
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  minimarket-api:
    build: .
    container_name: minimarket_api
    ports:
      - "8080:8080"
    environment:
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://postgres:5432/db_minimarket_pro413
      - QUARKUS_DATASOURCE_USERNAME=user_market
      - QUARKUS_DATASOURCE_PASSWORD=userpassword
    depends_on:
      - postgres
volumes:
  pgdata: